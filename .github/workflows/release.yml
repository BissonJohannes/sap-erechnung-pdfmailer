name: Release skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill ZIP
        run: |
          cd skill
          zip -r ../sap-erechnung-pdfmailer.zip sap-erechnung-pdfmailer
          cd ..
          unzip -l sap-erechnung-pdfmailer.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            sap-erechnung-pdfmailer.zip \
            docs/Skill-Anleitung.pdf \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
